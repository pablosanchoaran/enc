name: Novedades inmobiliarias Marina Alta

on:
  # El cron queda documentado, pero no dispara: GitHub solo ejecuta
  # `schedule` desde la rama por defecto y este fichero vive en la rama de
  # trabajo. La actualización diaria la hace una Routine de Claude a las 8:00,
  # que además publica el artefacto —cosa que Actions no puede hacer—.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marina-alta
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    # Dos horas y media: el rastreo completo ronda las dos, casi todo espera
    # del crawl-delay de 14 segundos que piden cuatro de las webs.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: marina-alta

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/marina-alta-real-estate-extractor-pa8ja0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marina-alta/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Extraer novedades
        run: npm run extract

      - name: Publicar el informe como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: informe-${{ github.run_number }}
          path: |
            marina-alta/report/index.html
            marina-alta/data/daily
          retention-days: 30

      # El sitio se despliega solo cuando la cuenta de Cloudflare está
      # configurada; sin los secretos, el resto del workflow sigue igual y el
      # informe se queda en el artifact del run.
      - name: Desplegar el sitio en Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name marina-alta --branch main --commit-dirty=true

      - name: Guardar datos e informe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data report
          if git diff --staged --quiet; then
            echo 'Sin cambios que guardar.'
            exit 0
          fi
          git commit -m "datos: novedades del $(date -u +%Y-%m-%d)"
          # El cron y una ejecución manual pueden solaparse con un push propio.
          for intento in 1 2 3 4; do
            git push && exit 0
            sleep $((2 ** intento))
            git pull --rebase origin claude/marina-alta-real-estate-extractor-pa8ja0
          done
          exit 1
